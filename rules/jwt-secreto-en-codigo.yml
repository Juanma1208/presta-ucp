rules:
  - id: presta.jwt-secreto-en-codigo
    languages: [python]
    severity: ERROR
    message: >-
      El JWT se firma o verifica con una clave escrita en el código. Quien lea el
      repositorio puede fabricar tokens válidos. Lee la clave de una variable de entorno.
    metadata:
      cwe: "CWE-798"
      asvs: "V13 (configuración: secretos fuera del código)"
      amenaza: "T3 (T-02) del Lab 1"
    pattern-either:
      - pattern: jwt.encode($DATOS, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)